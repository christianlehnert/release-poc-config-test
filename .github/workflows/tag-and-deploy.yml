name: Tag and deploy

# Runs after a pull request is merged into main.
# 1. The release bot creates the next configuration tag (release/x.y.z). This tag is the config_tag.
# 2. The release bot starts "Deploy" in release-poc-deployment with the newest pipeline tag,
#    environment test and this config_tag. Because the bot starts the run, the lead can approve it.

on:
  push:
    branches: [main]
    paths: ['terraform/**']

permissions:
  contents: read

concurrency:
  group: tag-and-deploy
  cancel-in-progress: false

env:
  ENVIRONMENT: test

jobs:
  tag-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get a token for the release bot
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            release-poc-deployment

      - name: Create the next configuration tag
        id: tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            -q '[.[].name | select(test("^release/[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                | sort_by(ltrimstr("release/") | split(".") | map(tonumber)) | last // "release/1.0.0"')
          IFS=. read -r major minor patch <<<"${last#release/}"
          next="release/${major}.${minor}.$((patch + 1))"
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --generate-notes --latest
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Configuration tag **${next}** created (previous: ${last})." >> "$GITHUB_STEP_SUMMARY"

      - name: Start Deploy in release-poc-deployment
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          CONFIG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          repo="${OWNER}/release-poc-deployment"
          pipeline_tag=$(gh release view --repo "$repo" --json tagName -q .tagName)
          gh workflow run deploy.yml --repo "$repo" --ref "$pipeline_tag" \
            -f environment="$ENVIRONMENT" -f config_tag="$CONFIG_TAG"
          {
            echo "Deploy started: environment **${ENVIRONMENT}**, config_tag **${CONFIG_TAG}**, pipeline tag **${pipeline_tag}**."
            echo ""
            echo "Runs: https://github.com/${repo}/actions/workflows/deploy.yml"
          } >> "$GITHUB_STEP_SUMMARY"
